name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.23.x
          - stable
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        if: matrix.go-version != 'stable'
        run: go test ./...
      - name: Generate coverage profile
        if: matrix.go-version == 'stable'
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Build coverage badge
        if: matrix.go-version == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir coverage-site
          go tool cover -html=coverage.out -o coverage-site/index.html
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')"
          COVERAGE="$coverage" python3 - <<'PY' > coverage-site/coverage.svg
          import os

          coverage = float(os.environ["COVERAGE"].removesuffix("%"))
          color = "brightgreen" if coverage >= 80 else "yellow" if coverage >= 50 else "red"
          value = f"{coverage:.1f}%"
          print(f'''<svg xmlns="http://www.w3.org/2000/svg" width="128" height="20" role="img" aria-label="coverage: {value}">
          <linearGradient id="a" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
          <clipPath id="b"><rect width="128" height="20" rx="3" fill="#fff"/></clipPath>
          <g clip-path="url(#b)"><path fill="#555" d="M0 0h63v20H0z"/><path fill="{color}" d="M63 0h65v20H63z"/><path fill="url(#a)" d="M0 0h128v20H0z"/></g>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11"><text x="31.5" y="15" fill="#010101" fill-opacity=".3">coverage</text><text x="31.5" y="14">coverage</text><text x="95.5" y="15" fill="#010101" fill-opacity=".3">{value}</text><text x="95.5" y="14">{value}</text></g>
          </svg>''')
      - name: Upload coverage site
        if: matrix.go-version == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: coverage-site


  deploy-coverage:
    name: Deploy coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy coverage site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  analyze:
    name: Vet and race detection
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Run vet
        run: go vet ./...
      - name: Run tests with race detection
        run: go test -race ./...
